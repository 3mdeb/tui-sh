header:
  title: " Dasharo Tools Suite Script ${DTS_VERSION} "
  subtitle: " (c) Dasharo <contact@dasharo.com> "
  link: "https://github.com/Dasharo/dasharo-issues"

sections:
  - label: "HARDWARE INFORMATION"
    entries:
      - label: "System Inf."
        value: "${SYSTEM_VENDOR} ${SYSTEM_MODEL}"
      - label: "Baseboard Inf."
        value: "${SYSTEM_VENDOR} ${BOARD_MODEL}"
      - label: "CPU Inf."
        value: "${CPU_VERSION}"
      - label: "RAM Virtual"
        value: "${RAM_INFO:-Not Specified}"

  - label: "FIRMWARE INFORMATION"
    entries:
      - label: "BIOS Inf."
        value: "${BIOS_VENDOR} ${BIOS_VERSION}"

  - label: "DPP credentials"
    condition: "${DPP_IS_LOGGED}"
    entries:
      - label: "Email"
        value: "${DPP_EMAIL_DISPLAY}"
      - label: "Password"
        value: "${DPP_PASSWORD_DISPLAY}"

  - label: "SSH status: ${SSH_STATUS}"
    condition: "${SSH_ACTIVE}"
    entries:
      - label: "IP"
        value: "${SSH_IP}"

menu:
  - key: "1"
    label: "Dasharo HCL report"
    callback: "echo 'Generating HCL report...' && sleep 1 && echo 'Report saved to /tmp/hcl-report.txt'"

  - key: "2"
    label: "${DASHARO_FIRMWARE_LABEL}"
    callback: "echo 'Checking for firmware updates...' && sleep 1 && echo 'Firmware is up to date'"
    condition: "${SHOW_DASHARO_FIRMWARE}"

  - key: "3"
    label: "Restore firmware from Dasharo HCL report"
    callback: "echo 'Restoring firmware from HCL report...' && sleep 1 && echo 'Firmware restored successfully'"
    condition: "${SHOW_RESTORE_FIRMWARE}"

  - key: "4"
    label: "${DPP_KEYS_LABEL}"
    callback: "echo 'Opening DPP keys editor...' && sleep 1"

  - key: "5"
    label: "DTS extensions"
    callback: "echo 'Loading DTS extensions...' && sleep 1 && echo 'No extensions available'"
    condition: "${SHOW_DTS_EXTENSIONS}"

  - key: "6"
    label: "Transition Dasharo Firmware"
    callback: "echo 'Transitioning to Dasharo firmware...' && sleep 1 && echo 'Transition completed'"
    condition: "${SHOW_TRANSITION}"

  - key: "7"
    label: "Fuse platform"
    callback: "echo 'WARNING: This will permanently fuse the platform!' && sleep 2"
    condition: "${SHOW_FUSE}"

  - key: "8"
    label: "Download and install comprehensive system diagnostics tool with hardware validation and automated reporting capabilities"
    callback: "echo 'Downloading diagnostics tool...' && sleep 1 && echo 'Installation complete!'"

footer:
  - key: "R"
    label: "reboot"
    callback: "echo 'System will reboot now...' && sleep 1"

  - key: "P"
    label: "poweroff"
    callback: "echo 'System will power off now...' && sleep 1"

  - key: "S"
    label: "enter shell"
    callback: "bash"

  - key: "K"
    label: "${SSH_LABEL}"
    callback: "${SCRIPT_DIR}/callbacks/toggle-ssh.sh"

  - key: "L"
    label: "${SEND_LOGS_LABEL}"
    callback: "${SCRIPT_DIR}/callbacks/toggle-logs.sh"

  - key: "C"
    label: "${DISPLAY_CRED_LABEL}"
    callback: "${SCRIPT_DIR}/callbacks/toggle-credentials.sh"
    condition: "${DPP_IS_LOGGED}"
