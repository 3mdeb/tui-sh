header:
  title: " TUI Utility Library Demo "
  subtitle: " Demonstrating modular library structure "

sections:
  - label: "LIBRARY STRUCTURE"
    entries:
      - label: "tui-util.sh"
        value: "Standalone utilities (colors, input, printing)"
      - label: "tui-core.sh"
        value: "Menu system (includes tui-util.sh)"
      - label: "tui-lib.sh"
        value: "Compatibility wrapper (sources tui-core.sh)"

  - label: "USE CASES"
    entries:
      - label: "Callbacks"
        value: "Can use tui-util.sh independently"
      - label: "Scripts"
        value: "Lightweight user interaction without menu"
      - label: "Full TUI"
        value: "Use tui-core.sh or tui-lib.sh"

menu:
  - key: "1"
    label: "Interactive util demo (uses only tui-util.sh)"
    callback: "${SCRIPT_DIR}/callbacks/interactive-util-demo.sh"

  - key: "2"
    label: "Simple echo demo"
    callback: "echo 'This is a simple command callback'"

  - key: "3"
    label: "Show library paths"
    callback: "echo 'Util lib: lib/tui-util.sh' && echo 'Core lib: lib/tui-core.sh' && echo 'Main lib: lib/tui-lib.sh'"

footer:
  - key: "Q"
    label: "quit"
    callback: "exit 0"

  - key: "S"
    label: "enter shell"
    callback: "bash"
